# TEE Oracle — Phala Cloud Deployment
#
# Deploy any oracle entry:
#   npm run oracle:image
#   npm run oracle:deploy -- src/examples/prediction-market.ts
#   npm run oracle:deploy -- src/examples/web-data-oracle.ts
#
# First deploy: deploy-cvm.mjs runs `phala link` afterwards to record app_id in phala.toml.
# On startup, the oracle self-registers in TeeVerifier via initValidator + TDX quote.
#
# ORACLE_IMAGE is injected into the generated compose file by npm run oracle:deploy.
# The image tag is saved in root .oracle-image-state.json by npm run oracle:image.
# ORACLE_ENTRY is set by root scripts/deploy-cvm.mjs and selects the entry point
# compiled into apps/oracle/dist/ inside the CVM image.
#
# Attestation verification (trustless):
#   curl -s http://localhost:3001/attestation | curl -d @- http://localhost:8080/verify | jq

services:
  oracle:
    image: ${ORACLE_IMAGE:?ORACLE_IMAGE must be set to a pushed registry image}
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ORACLE_ENTRY
      - APP_NAME
      # Required
      - NETWORK
      - RPC_URL_BASE
      - RPC_URL_BASE_SEPOLIA
      - PRIVATE_KEY
      - LLM_API_KEY
      - LLM_API_BASE
      - LLM_VALIDATION_MODEL
      - DSTACK_VERIFIER_URL
      # 0G Storage
      - RPC_URL_ZERO_G
      - INDEXER_URL_ZERO_G
      # Script-managed private registry credentials for private GHCR pulls.
      # Values are injected by root scripts/deploy-cvm.mjs.
      - DSTACK_DOCKER_USERNAME
      - DSTACK_DOCKER_PASSWORD
      - DSTACK_DOCKER_REGISTRY
    volumes:
      - /var/run/tappd.sock:/var/run/tappd.sock
    restart: unless-stopped

  # dstack-verifier — trustless TDX attestation verifier (no Phala Cloud dependency)
  #
  # Usage:
  #   Verify the oracle locally:
  #     curl -s http://localhost:3001/attestation | curl -d @- http://localhost:8080/verify | jq
  #
  #   Verify remotely (from outside):
  #     curl -s https://<your-phala-cvm-oracle-url>/attestation | curl -d @- http://localhost:8080/verify | jq
  #
  # Checks: Intel root CA, MRTD, RTMR0-3 (event log replay), TCB status, Docker image digest.
  # See: https://docs.phala.com/phala-cloud/attestation/verify-the-platform
  verifier:
    image: dstacktee/dstack-verifier:latest
    ports:
      - "8080:8080"
    restart: unless-stopped
