# TEE Oracle — Phala Cloud Deployment
#
# Deploy any oracle entry:
#   npm run deploy -- src/examples/prediction-market.ts
#   npm run deploy -- src/examples/web-data-oracle.ts
#
# First deploy: run `phala link` afterwards to record app_id in phala.toml.
# On startup, the oracle self-registers in TeeVerifier via initValidator + TDX quote.
#
# ORACLE_ENTRY is set by scripts/deploy-cvm.mjs and selects the entry point
# compiled into apps/oracle/dist/ inside the CVM image.
#
# Attestation verification (trustless):
#   curl -s http://localhost:3001/attestation | curl -d @- http://localhost:8080/verify | jq

services:
  oracle:
    build:
      context: ../..
      dockerfile: apps/oracle/Dockerfile
    image: tee-agent-oracle:latest
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ORACLE_ENTRY
      # Required
      - NETWORK
      - RPC_URL_BASE
      - RPC_URL_BASE_SEPOLIA
      - PRIVATE_KEY
      - LLM_API_KEY
      - LLM_API_BASE
      - LLM_VALIDATION_MODEL
      - DSTACK_VERIFIER_URL
      # 0G Storage
      - ZERO_G_RPC_URL
      - ZERO_G_INDEXER_URL
    volumes:
      - /var/run/tappd.sock:/var/run/tappd.sock
    restart: unless-stopped

  # dstack-verifier — trustless TDX attestation verifier (no Phala Cloud dependency)
  #
  # Usage:
  #   Verify the oracle locally:
  #     curl -s http://localhost:3001/attestation | curl -d @- http://localhost:8080/verify | jq
  #
  #   Verify remotely (from outside):
  #     curl -s https://your-oracle/attestation | curl -d @- http://localhost:8080/verify | jq
  #
  # Checks: Intel root CA, MRTD, RTMR0-3 (event log replay), TCB status, Docker image digest.
  # See: https://docs.phala.com/phala-cloud/attestation/verify-the-platform
  verifier:
    image: dstacktee/dstack-verifier:latest
    ports:
      - "8080:8080"
    restart: unless-stopped
