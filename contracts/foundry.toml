[profile.default]
src      = "src"
test     = "test-foundry"
out      = "artifacts-foundry"
cache_path = "cache/foundry"
via_ir   = true
optimizer        = true
optimizer_runs   = 200

# Allow solc to read from the monorepo root node_modules.
allow_paths = ["../node_modules"]

remappings = [
    "@openzeppelin/=../node_modules/@openzeppelin/",
    "forge-std/=../node_modules/forge-std/src/",
]

[invariant]
runs           = 256
depth          = 128
fail_on_revert = false

[fuzz]
runs = 1000
